name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - uses: ./.github/actions/build-tpe-explorer
        with:
          tpe-tui-repository: ${{ vars.TPE_TUI_REPOSITORY }}
          tpe-tui-ref: ${{ vars.TPE_TUI_REF || 'main' }}
          cedar-ref: ${{ vars.TPE_CEDAR_REF || 'symcc-wasm' }}
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
