name: Build the TPE explorer
description: >
  Builds the TPE explorer's WASM bindings from the cedar-tpe-explorer crate
  into src/routes/tpe-explorer/pkg and downloads the CVC5 WebAssembly build
  into static/cvc5. Without this step the site still builds, with the
  explorer page showing a "not built" message.

inputs:
  cedar-repository:
    description: Repository (owner/name) with the cedar-tpe-explorer crate
    required: false
    default: cedar-policy/cedar
  cedar-ref:
    description: Branch, tag, or SHA of cedar
    required: false
    default: tpe-explorer

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.cedar-repository }}
        ref: ${{ inputs.cedar-ref }}
        path: .tpe/cedar

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: .tpe/cedar

    - name: Read the pinned wasm-bindgen version
      id: wasm-bindgen
      shell: bash
      run: |
        v=$(sed -n 's/^wasm-bindgen = { version = "=\([^"]*\)".*/\1/p' .tpe/cedar/cedar-tpe-explorer/Cargo.toml)
        test -n "$v"
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

    - name: Build WASM bindings
      shell: bash
      run: CEDAR_DIR=.tpe/cedar npm run build:tpe

    - name: Fetch CVC5 (WebAssembly)
      shell: bash
      run: npm run fetch:cvc5
